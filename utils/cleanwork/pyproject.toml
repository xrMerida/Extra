[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanwork"
version = "1.0.0"
description = "Interactive CLI to sort files from Desktop and Downloads into Documents"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
cleanwork = "cleanwork.__main__:main"
