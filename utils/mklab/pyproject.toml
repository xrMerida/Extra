[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mklab"
version = "1.0.0"
description = "Scaffold new CMake projects from a template"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.package-data]
mklab = ["template/**/*"]

[project.scripts]
u-mklab = "mklab.__main__:run"
