[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpdf"
version = "1.0.0"
description = "Interactive PDF generator for lab assignments"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fpdf2"]

[project.scripts]
u-genpdf = "genpdf.__main__:run"
